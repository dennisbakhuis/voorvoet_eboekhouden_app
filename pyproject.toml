[project]
name = "voorvoet-app"
version = "0.3.2"
description = "Frontend app to import data from Voorvoet.nl to E-boekhouden.nl."
authors = [{ name = "Dennis Bakhuis", email = "git@bakhuis.nu" }]
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pandas>=3.1.0",
    "openpyxl>=3.1.5",
    "eboekhouden-python>=0.4.2",
    "streamlit>=1.66.1",
    "tomli>=2.5.0",
    "htbuilder>=0.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.2.0",
    "coverage>=7.17.0",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [".", "./voorvoet_app"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["ignore::DeprecationWarning"]

