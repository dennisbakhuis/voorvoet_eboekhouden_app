[project]
name = "voorvoet-app"
version = "0.3.2"
description = "Frontend app to import data from Voorvoet.nl to E-boekhouden.nl."
authors = [{ name = "Dennis Bakhuis", email = "git@bakhuis.nu" }]
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pandas>=3.1.0",
    "openpyxl>=3.1.5",
    "eboekhouden-python>=0.4.2",
    "streamlit>=1.66.1",
    "tomli>=2.5.0",
    "htbuilder>=0.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.2.0",
    "coverage>=7.17.0",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [".", "./voorvoet_app"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"voorvoet_app/Voorvoet_App.py" = ["N999"]
"voorvoet_app/pages/*.py" = ["N999", "BLE001"]
"tests/test_pages.py" = ["F401"]

[tool.mypy]
files = ["voorvoet_app"]
mypy_path = ["voorvoet_app", "voorvoet_app/pages"]
explicit_package_bases = true
exclude = ['^voorvoet_app/__init__\.py$', '^voorvoet_app/pages/__init__\.py$']

[[tool.mypy.overrides]]
module = ["eboekhouden_python.*", "htbuilder.*"]
ignore_missing_imports = true
